name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes
        run: pytest -v

      - name: Verificação de ponta a ponta no servidor
        run: |
          DATA="$RUNNER_TEMP/minikv-ci"
          minikv-server --dir "$DATA" --port 6380 &
          SERVER_PID=$!
          python - <<'EOF'
          import time

          from minikv import Client

          for _ in range(50):
              try:
                  client = Client(port=6380)
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("servidor não subiu")

          with client:
              assert client.ping()
              assert client.set("ci", "ok")
              assert client.get("ci") == b"ok"
              assert client.execute("INCR", "contador") == 1
          print("servidor respondeu")
          EOF
          kill "$SERVER_PID"
          wait "$SERVER_PID"
          test "$(minikv "$DATA" get ci)" = "ok"
